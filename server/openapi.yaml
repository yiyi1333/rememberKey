openapi: 3.0.3
info:
  title: rememberKey encrypted vault API
  version: 1.0.0
  description: |
    HTTPS required in production. This service stores only encrypted bundles and records.
    All write requests MUST include Origin exactly equal to RK_ORIGIN, including non-browser clients.
    Binary values are unpadded base64url. UUIDs generated by clients. Timestamps are UTC RFC3339.
    Success responses use {data: ...}; failures use {error: {code, message}}.
    Authentication challenges are consumed on every signature attempt. Refresh reuse revokes the family.
    Public keyBundle lookup permits account enumeration and offline password guessing; choose strong passwords.
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /healthz:
    servers:
      - url: /
    get:
      security: []
      responses:
        '200': {description: Process alive; no body}
  /readyz:
    servers:
      - url: /
    get:
      security: []
      responses:
        '200': {description: SQLite reachable; no body}
        '503': {description: SQLite unavailable}
  /status:
    get:
      security: []
      responses:
        '200':
          description: Bootstrap status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      initialized: {type: boolean}
  /registrations:
    post:
      security: []
      description: Initial account requires RK_BOOTSTRAP_TOKEN. Subsequent accounts require a single-use invitation. Does not authenticate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inviteToken, accountId, username, signPublicKey, boxPublicKey, keyBundle, device]
              properties:
                inviteToken: {type: string}
                accountId: {type: string, format: uuid}
                username: {type: string, minLength: 3, maxLength: 64}
                signPublicKey: {type: string}
                boxPublicKey: {type: string}
                keyBundle: {$ref: '#/components/schemas/KeyBundle'}
                device: {$ref: '#/components/schemas/DeviceInput'}
      responses:
        '201': {description: 'data: {accountId}'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /accounts/lookup:
    get:
      security: []
      parameters:
        - in: query
          name: username
          required: true
          schema: {type: string}
      responses:
        '200': {description: 'data: {accountId,username,signPublicKey,boxPublicKey,keyBundle}'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/challenges:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, deviceId]
              properties:
                accountId: {type: string, format: uuid}
                deviceId: {type: string, format: uuid}
      responses:
        '200': {description: 'data: {id,message,expiresAt}; expires in two minutes. Sign the exact UTF8 message using device Ed25519 private key.'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/sessions:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, signature]
              properties:
                challengeId: {type: string}
                signature: {type: string}
      responses:
        '200':
          description: 'data: {accessToken,accountId,expiresAt}; sets rk_refresh Secure HttpOnly SameSite=Strict cookie scoped to /api/v1/auth. Bearer lifetime 15 minutes.'
        '401': {$ref: '#/components/responses/Error'}
    delete:
      responses:
        '204': {description: Current refresh family revoked and cookie cleared}
        '401': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      security:
        - refreshCookie: []
      responses:
        '200': {description: 'data: {accessToken,accountId,expiresAt}; refresh cookie rotated, 30 day expiry. Reuse revokes all family access and refresh tokens.'}
        '401': {$ref: '#/components/responses/Error'}
  /devices:
    post:
      security: []
      description: Account-signed enrollment. Exact duplicate proof is idempotent; revoked device IDs cannot reenroll.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/DeviceInput'}
                - type: object
                  required: [accountId]
                  properties:
                    accountId: {type: string, format: uuid}
      responses:
        '201': {description: 'data: {id}'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    get:
      responses:
        '200': {description: 'data: [{id,name,createdAt,revokedAt}] belonging to current account only'}
  /devices/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    delete:
      responses:
        '204': {description: Device and all its session families revoked}
        '404': {$ref: '#/components/responses/Error'}
  /me:
    get:
      responses:
        '200': {description: 'data: {accountId,username,role,signPublicKey,boxPublicKey,keyBundle,bundleVersion}'}
  /key-bundle:
    put:
      description: 'Sign rememberKey:bundle:1:${accountId}:${expectedVersion}:${sha256hex(bundleJson)} using identity key. Digest is over exact UTF8 wire string. privateWrap immutable in v1.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bundleJson, expectedVersion, signature]
              properties:
                bundleJson: {type: string, description: Exact serialized KeyBundle JSON}
                expectedVersion: {type: integer, minimum: 1}
                signature: {type: string}
      responses:
        '200': {description: 'data: {version}'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sync/operations:
    post:
      description: |
        Batch processed in order with one authorization-checked transaction per operation.
        Each operation is signed with identity Ed25519 key over:
        rememberKey:op:1:${accountId}:${operationId}:${id}:${baseRevision}:${deleted?1:0}:${sha256hex(envelope or '')}
        The envelope is an exact preserved JSON STRING, not an object. Deleted envelopes MUST be null.
        Exact retry replays persisted result, including conflicts. Different body with same operationId returns 409.
        A later malformed op may fail the batch after earlier operations have committed; safely retry the exact batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: {$ref: '#/components/schemas/Operation'}
      responses:
        '200':
          description: Operation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            operationId: {type: string, format: uuid}
                            status: {type: string, enum: [applied, conflict]}
                            record: {$ref: '#/components/schemas/Record'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /sync/changes:
    get:
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'data: {changes:[{seq,...Record}],cursor,hasMore}; ordered stable per-page snapshot, account-isolated. Logs and tombstones retained indefinitely in v1.'}
  /sync/snapshot:
    get:
      responses:
        '200': {description: 'data: {records:[Record],cursor}; transaction-consistent, max 10000 records including tombstones.'}
        '409': {description: Snapshot exceeds v1 bound; large-vault pagination not implemented}
  /admin/users:
    get:
      responses:
        '200': {description: 'Admin only. data: [{accountId,username,role,disabled,createdAt}]'}
        '403': {$ref: '#/components/responses/Error'}
  /admin/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [disabled]
              properties:
                disabled: {type: boolean}
      responses:
        '200': {description: 'Admin only. data: {accountId,username,role,disabled,createdAt}; disables and revokes atomically.'}
        '409': {description: Cannot disable self or last active admin}
  /admin/invitations:
    post:
      responses:
        '201': {description: 'Admin only. data: {token,expiresAt}; single-use 24 hour invitation, hash stored at rest.'}
  /admin/audit:
    get:
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'Admin only. data: {events:[{seq,actorId,action,targetId,createdAt}],cursor,hasMore}; no keys, tokens, ciphertext or user secrets.'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: Opaque}
    refreshCookie: {type: apiKey, in: cookie, name: rk_refresh}
  parameters:
    Cursor:
      in: query
      name: cursor
      schema: {type: integer, format: int64, minimum: 0, default: 0}
    Limit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 100, default: 100}
  responses:
    Error:
      description: Error; all endpoints may additionally return 401, 403 Origin rejection, 413 body limit, 429 rate limit or 500.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: {type: string}
                  message: {type: string}
  schemas:
    Wrap:
      type: object
      additionalProperties: false
      required: [nonce, ciphertext]
      properties:
        nonce: {type: string, description: 24 bytes base64url}
        ciphertext: {type: string}
    KeyBundle:
      type: object
      additionalProperties: false
      required: [version, salt, passwordWrap, recoveryWrap, privateWrap]
      properties:
        version: {type: integer, enum: [1]}
        salt: {type: string, description: 16 bytes base64url; Argon2id13 opslimit=3 memlimit=67108864 fixed client side}
        passwordWrap: {$ref: '#/components/schemas/Wrap'}
        recoveryWrap: {$ref: '#/components/schemas/Wrap'}
        privateWrap: {$ref: '#/components/schemas/Wrap'}
    DeviceInput:
      type: object
      required: [id, name, publicKey, proof]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128}
        publicKey: {type: string, description: 32 bytes Ed25519 base64url}
        proof: {type: string, description: 'Account identity signature over rememberKey:device:1:${accountId}:${deviceId}:${publicKey}'}
    Operation:
      type: object
      additionalProperties: false
      required: [operationId, id, baseRevision, deleted, envelope, signature]
      properties:
        operationId: {type: string, format: uuid}
        id: {type: string, format: uuid}
        baseRevision: {type: integer, format: int64, minimum: 0}
        deleted: {type: boolean}
        envelope:
          type: string
          nullable: true
          maxLength: 131072
          description: 'Serialized {version:1,nonce,ciphertext,wrappedKey}; nonce=24 bytes, ciphertext=16..98304 bytes, wrappedKey=80 bytes, all base64url.'
        signature: {type: string, description: 64 byte Ed25519 detached signature base64url}
    Record:
      type: object
      nullable: true
      required: [id, revision, deleted, envelope, signature, operationId, baseRevision]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        deleted: {type: boolean}
        envelope: {type: string, nullable: true}
        signature: {type: string}
        operationId: {type: string, format: uuid}
        baseRevision: {type: integer, format: int64, minimum: 0}
