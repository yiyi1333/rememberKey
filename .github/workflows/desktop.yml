name: Experimental desktop build (unsigned preview)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
        working-directory: desktop
      - name: Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Build unsigned experimental preview
        run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-unsigned-${{ matrix.os }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7
      - name: State artifact limitations
        shell: bash
        run: echo 'Experimental static preview only. No vault, no native SQLite, no credential storage, no server session. Unsigned/not notarized. CI success is not desktop security acceptance.' >> "$GITHUB_STEP_SUMMARY"
