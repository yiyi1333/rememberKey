[package]
name = "rememberkey-desktop"
version = "0.1.0"
description = "Experimental rememberKey desktop safety preview (not a password vault)"
authors = ["rememberKey contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
