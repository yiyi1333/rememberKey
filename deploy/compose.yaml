name: rememberkey
services:
  app:
    image: rememberkey:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      RK_ORIGIN: ${RK_ORIGIN:?Run scripts/deploy.sh first}
      RK_BOOTSTRAP_TOKEN: ${RK_BOOTSTRAP_TOKEN:?Bootstrap token required}
      RK_DATA_DIR: /data
      RK_WEB_DIR: /app/web
      RK_DEV: "false"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 30s
    networks: [private]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    user: "10001:10001"
    environment:
      RK_DOMAIN: ${RK_DOMAIN:?Public DNS hostname required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME contact email required}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    depends_on:
      app: {condition: service_healthy}
    networks: [private, edge]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  private:
    internal: true
  edge: {}
